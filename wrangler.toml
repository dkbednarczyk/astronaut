# Cloudflare Pages configuration. This file is the source of truth for the
# project: settings here cannot be edited in the dashboard.
#
# Before the first deploy, fill in `database_id` under [[d1_databases]]:
#   npx wrangler d1 create upvotes
# It prints a database_id. Paste that value below and commit.

name = "astronaut"
compatibility_date = "2026-09-28"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "upvotes"
# TODO: replace with the id printed by `npx wrangler d1 create upvotes`
database_id = ""
